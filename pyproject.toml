[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "walsh"
version = "0.2.0"
description = "Image compression with the Walsh-Hadamard transform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oskar Jarczyk", email = "oskar.jarczyk@gmail.com" }]
maintainers = [{ name = "Oskar Jarczyk", email = "oskar.jarczyk@gmail.com" }]
keywords = ["walsh", "hadamard", "transform", "image", "compression", "dsp", "bmp", "ppm", "netpbm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=1.24,<3", "click>=8.1,<9"]

[project.optional-dependencies]
# A real extra, because `pip install walsh[demo]` is something a user may want:
# it is what examples/roundtrip.py needs. The package itself parses BMP by hand.
demo = ["matplotlib>=3.7,<4", "Pillow>=10.0,<13"]

[project.scripts]
walsh = "walsh.cli:main"

[project.urls]
Homepage = "https://github.com/oskar-j/walsh-hadamard-transform"
Repository = "https://github.com/oskar-j/walsh-hadamard-transform"
Issues = "https://github.com/oskar-j/walsh-hadamard-transform/issues"
Changelog = "https://github.com/oskar-j/walsh-hadamard-transform/blob/master/CHANGELOG.md"

# PEP 735 groups rather than extras: these are for working on the project, not
# for installing it. `uv sync --group dev` pulls them in; pip 25.1+ can too,
# with `pip install --group dev`.
[dependency-groups]
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<8",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
    "build>=1.2,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
walsh = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is opt-in via --cov so a plain `pytest` stays fast; CI always passes it.
addopts = "-ra"

[tool.coverage.run]
source = ["src/walsh"]
branch = true

[tool.coverage.report]
# CI enforces this on every matrix job, and those jobs are required checks on
# master, so a pull request cannot lower coverage below it. The README badge
# states this floor rather than a number that would drift.
fail_under = 90
show_missing = true
exclude_also = [
    # Script entry points are exercised by running the command, not by importing it.
    'if __name__ == .__main__.:',
    # Abstract method bodies declare a signature and have nothing to run.
    '^\s*\.\.\.$',
    # Typing-only imports never execute at runtime.
    'if TYPE_CHECKING:',
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
# No python_version pin: numpy's bundled stubs require mypy to target 3.12+.
# Minimum-version compatibility is enforced by ruff's target-version instead.
packages = ["walsh"]
strict = true
