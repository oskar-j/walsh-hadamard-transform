# Keeps the pinned actions and uv.lock current, as pull requests that go
# through CI like any other.
#
# Both ecosystems are grouped into one pull request each, once a month, and a
# release must be a week old before it is proposed: a compromised tag or
# upload tends to be noticed and pulled within days, and a pin should not
# arrive before that.

version: 2
updates:
  # The workflows pin every action to a commit SHA with its release in a
  # comment; Dependabot moves both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # uv.lock only. pyproject.toml states the supported range and the
  # requirements*.txt mirrors copy it (tests/project/test_requirements_mirror.py),
  # so a new release is proposed only when the range already admits it.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    versioning-strategy: lockfile-only
    cooldown:
      default-days: 7
    groups:
      uv:
        patterns: ["*"]
