name: Release

# Publishes a GitHub Release, then the same artifacts to PyPI, whenever a
# version bump lands on master.
#
# The version in pyproject.toml is the single source of truth; the release is
# tagged v<version> and its notes are taken from the matching CHANGELOG.md
# section. Re-running on an already-released version is a no-op, so ordinary
# pushes to master that do not change the version are safely ignored. This is
# the only workable shape: PyPI permanently rejects a re-upload of a version it
# already has, so "publish on every merge" has to mean "publish on every merge
# that bumps the version".
#
# The PyPI upload is a dependent job rather than a separate workflow listening
# for `release: published`. That is deliberate: releases created with the
# default GITHUB_TOKEN do not trigger further workflow runs, so a
# `release`-triggered workflow would never fire here.
#
# Every action is pinned to a full commit SHA, with the release it came from in
# the comment, and Dependabot proposes new pins (.github/dependabot.yml). That
# matters most for the PyPI upload: pinned to a branch, it would run whatever
# the branch pointed at on the day, holding the identity allowed to publish.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Retry the PyPI upload for the current version even though its GitHub Release already exists"
        type: boolean
        default: false

# Nothing by default. Each job asks for what it uses, so a job added later
# starts with no access rather than inheriting the release job's write.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the tag and the GitHub Release through gh
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      # gh reads the token from GH_TOKEN and nothing here pushes, so the token
      # is not left in .git/config for the build and the test suite to read.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # No cache: this job builds what is uploaded to PyPI, so it resolves from
      # the index rather than restoring what an earlier run saved.
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Resolve version
        id: version
        run: |
          VERSION=$(uv version --short)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version ${VERSION}"

      # `exists` gates creating the GitHub Release; `publish` gates building and
      # uploading to PyPI. They differ only on a forced re-run, which exists so a
      # failed PyPI upload can be retried without deleting and recreating the release.
      - name: Decide what this run should do
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_PUBLISH: ${{ inputs.force_publish }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            EXISTS=true
            echo "Release ${{ steps.version.outputs.tag }} already exists."
          else
            EXISTS=false
          fi
          echo "exists=${EXISTS}" >> "$GITHUB_OUTPUT"

          if [ "${EXISTS}" = "false" ] || [ "${FORCE_PUBLISH}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to do."
          fi

      - name: Extract release notes from CHANGELOG.md
        if: steps.check.outputs.exists == 'false'
        run: |
          awk -v ver="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG.md section found for ${{ steps.version.outputs.version }}." >&2
            exit 1
          fi
          cat release_notes.md

      # The release is the last gate before PyPI, and PyPI uploads cannot be
      # undone, so prove the tree is sound before building from it. The
      # coverage floor applies here too: nothing under-tested reaches PyPI.
      # --locked for the same reason as in ci.yml: a stale lock must fail here,
      # not be silently re-resolved on the way to a permanent upload.
      - name: Run the test suite with coverage
        if: steps.check.outputs.exists == 'false'
        run: uv run --locked --group dev pytest -q --cov --cov-report=term-missing

      - name: Build distributions
        if: steps.check.outputs.exists == 'false'
        run: uv build

      - name: Check the distribution metadata
        if: steps.check.outputs.exists == 'false'
        run: uvx twine check dist/*

      # The artifacts themselves, not the checkout: unpack the sdist and run
      # its own tests, as CI does, since this is what is about to be published.
      - name: Test the sdist from the inside
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir /tmp/sdist && tar -xzf dist/*.tar.gz -C /tmp/sdist
          cd /tmp/sdist/walsh-*
          uv venv .venv
          uv pip install --python .venv/bin/python -e . pytest
          .venv/bin/python -m pytest -q -p no:cacheprovider

      # A forced retry must publish the bytes already attached to the release,
      # not a rebuild: setuptools output is not reproducible (timestamps at
      # least, and the build backend is unpinned), and a dispatched retry runs
      # on the branch tip while the release was pinned to a commit. So the
      # retry path downloads the release assets instead of building.
      - name: Fetch the artifacts attached to the existing release
        if: steps.check.outputs.exists == 'true' && steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${{ steps.version.outputs.tag }}" --dir dist \
            --pattern '*.whl' --pattern '*.tar.gz'
          ls -l dist

      # Hand the exact same artifacts to the PyPI job, rather than rebuilding
      # them there, so what is on PyPI matches what is on the release: on a
      # first run the freshly built files, on a retry the release's own assets.
      - name: Upload distributions for the PyPI job
        if: steps.check.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Create the GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file release_notes.md \
            --target "${GITHUB_SHA}" \
            dist/*

  publish-pypi:
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/walsh

    # Trusted Publishing (OIDC) - no API token is stored in this repository.
    # This job-level block replaces the workflow's, so the OIDC token is all
    # this job holds.
    permissions:
      id-token: write # the OIDC token PyPI exchanges for an upload credential

    steps:
      - name: Download the distributions built for the release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # Makes a forced re-run safe if an earlier attempt uploaded some files.
          skip-existing: true
