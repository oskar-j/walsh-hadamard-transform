name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# setup-uv is pinned to an exact version rather than a floating major like the
# other actions: it publishes major tags only up to v7, so `@v9` does not
# resolve. Bump this deliberately when a new release lands.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      # --locked makes a stale uv.lock a failure rather than a silent re-resolve:
      # plain `uv sync` rewrites the lock in the runner, so every check could
      # pass against a dependency set that exists nowhere in the repository.
      # It also trips on a version bump merged without `uv lock`, since the lock
      # records the project's own version.
      - name: Install the project and its dev dependencies
        run: uv sync --locked --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # --locked makes a stale uv.lock a failure rather than a silent re-resolve:
      # plain `uv sync` rewrites the lock in the runner, so every check could
      # pass against a dependency set that exists nowhere in the repository.
      # It also trips on a version bump merged without `uv lock`, since the lock
      # records the project's own version.
      - name: Install the project and its dev dependencies
        run: uv sync --locked --group dev

      # --cov applies the fail_under threshold from [tool.coverage.report] in
      # pyproject.toml, so a pull request that drops coverage below 90% fails
      # here and cannot be merged - the `test` jobs are required checks on master.
      - name: Run tests with coverage
        run: uv run pytest -v --cov --cov-report=term-missing --cov-report=xml

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

  # Proves the sdist and wheel build and that their metadata is valid, so a
  # release cannot be the first time we discover a packaging problem.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Build distributions
        run: uv build

      - name: Check the distribution metadata
        run: uvx twine check dist/*

      # The wheel must work with numpy alone; matplotlib and Pillow are the
      # `demo` extra and must not have become hard requirements. One input per
      # reader family, so packaging cannot silently drop a format module.
      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/walsh --version
          /tmp/smoke/bin/walsh compress data/bmp/image.bmp /tmp/smoke.cim
          /tmp/smoke/bin/walsh extract /tmp/smoke.cim /tmp/smoke.bmp
          # The codec is lossy, so a byte-identical result would mean the
          # transform never ran. Anything else is the expected outcome.
          if cmp -s data/bmp/image.bmp /tmp/smoke.bmp; then
            echo "unexpected: round trip returned the input unchanged" >&2
            exit 1
          fi
          test -s /tmp/smoke.cim
          # The checked-in sample outputs are the codec's contract, and since
          # 0.4.12 the transform's arithmetic is exact, so the bytes must match
          # on this runner's openblas as they do under macOS Accelerate, where
          # the reference was written. This is the cross-platform proof.
          # The samples sit in a folder per file type: data/ppm/earth.ppm.
          # earth.png is compressed and filtered by libpng (Netpbm wrote it)
          # and must still reach the transform as the same pixels.
          for kind in ppm pam tiff npy pkl png; do
            /tmp/smoke/bin/walsh compress "data/$kind/earth.$kind" /tmp/smoke-earth.cim
            cmp data/cim/transformed_earth.cim /tmp/smoke-earth.cim
          done
          /tmp/smoke/bin/walsh extract data/cim/transformed_earth.cim /tmp/smoke-earth.ppm
          cmp data/ppm/recreated.ppm /tmp/smoke-earth.ppm
          # A picture as the output of compress skips the .cim (0.5.1) and
          # must write the same reconstruction as the two steps above.
          /tmp/smoke/bin/walsh compress data/ppm/earth.ppm /tmp/smoke-direct.ppm
          cmp data/ppm/recreated.ppm /tmp/smoke-direct.ppm
          # ...in any pair of formats (0.5.2): the PNG in, a TIFF out.
          /tmp/smoke/bin/walsh compress data/png/earth.png /tmp/smoke-direct.tiff
          cmp data/tiff/recreated.tiff /tmp/smoke-direct.tiff
          # A PNG is a zlib stream, whose bytes may differ between zlib builds,
          # so the PNG written here is compared by the pixels it decodes to.
          /tmp/smoke/bin/walsh extract data/cim/transformed_earth.cim /tmp/smoke-earth.png
          /tmp/smoke/bin/python -c "from walsh.image import PNGImage, PPMImage; png = PNGImage(); png.load('/tmp/smoke-earth.png'); ppm = PPMImage(); ppm.set_array(png.get_array()); ppm.save('/tmp/smoke-earth-from-png.ppm')"
          cmp data/ppm/recreated.ppm /tmp/smoke-earth-from-png.ppm
          echo "wheel smoke test passed"

      # The wheel is built from [tool.setuptools.packages.find] and cannot
      # reflect a MANIFEST.in mistake; only the sdist can, and `twine check`
      # validates its metadata without unpacking its payload. So unpack it and
      # run its own tests from inside, which is what a downstream packager does.
      # No coverage floor here: [tool.coverage.run] source is a repository path
      # and would read 0% against an installed copy.
      - name: Test the sdist from the inside
        run: |
          mkdir /tmp/sdist && tar -xzf dist/*.tar.gz -C /tmp/sdist
          cd /tmp/sdist/walsh-*
          uv venv .venv
          uv pip install --python .venv/bin/python -e . pytest
          .venv/bin/python -m pytest -q -p no:cacheprovider
          echo "sdist test passed"
